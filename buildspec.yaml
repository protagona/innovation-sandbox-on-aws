version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "Installing dependencies..."
      - npm ci
  pre_build:
    commands:
      - echo "Setting npm script shell to bash..."
      - npm config set script-shell "/bin/bash"
      - |
        echo "Generating .env file from environment variables..."
        # Generate .env file from CodeBuild environment variables
        # Variables match those defined in .env.example
        cat > .env << 'ENVEOF'
        # Auto-generated by buildspec.yaml from CodeBuild environment variables
        ENVEOF

        # Required variables
        [ -n "$HUB_ACCOUNT_ID" ] && echo "HUB_ACCOUNT_ID=$HUB_ACCOUNT_ID" >> .env
        [ -n "$NAMESPACE" ] && echo "NAMESPACE=$NAMESPACE" >> .env
        [ -n "$PARENT_OU_ID" ] && echo "PARENT_OU_ID=$PARENT_OU_ID" >> .env
        [ -n "$AWS_REGIONS" ] && echo "AWS_REGIONS=$AWS_REGIONS" >> .env
        [ -n "$IDENTITY_STORE_ID" ] && echo "IDENTITY_STORE_ID=$IDENTITY_STORE_ID" >> .env
        [ -n "$SSO_INSTANCE_ARN" ] && echo "SSO_INSTANCE_ARN=$SSO_INSTANCE_ARN" >> .env
        [ -n "$ORG_MGT_ACCOUNT_ID" ] && echo "ORG_MGT_ACCOUNT_ID=$ORG_MGT_ACCOUNT_ID" >> .env
        [ -n "$IDC_ACCOUNT_ID" ] && echo "IDC_ACCOUNT_ID=$IDC_ACCOUNT_ID" >> .env
        [ -n "$ACCEPT_SOLUTION_TERMS_OF_USE" ] && echo "ACCEPT_SOLUTION_TERMS_OF_USE=$ACCEPT_SOLUTION_TERMS_OF_USE" >> .env

        # Optional variables
        [ -n "$DEPLOYMENT_MODE" ] && echo "DEPLOYMENT_MODE=$DEPLOYMENT_MODE" >> .env
        [ -n "$ADMIN_GROUP_NAME" ] && echo "ADMIN_GROUP_NAME=$ADMIN_GROUP_NAME" >> .env
        [ -n "$MANAGER_GROUP_NAME" ] && echo "MANAGER_GROUP_NAME=$MANAGER_GROUP_NAME" >> .env
        [ -n "$USER_GROUP_NAME" ] && echo "USER_GROUP_NAME=$USER_GROUP_NAME" >> .env
        [ -n "$NUKE_CONFIG_FILE_PATH" ] && echo "NUKE_CONFIG_FILE_PATH=$NUKE_CONFIG_FILE_PATH" >> .env
        [ -n "$PRIVATE_ECR_REPO" ] && echo "PRIVATE_ECR_REPO=$PRIVATE_ECR_REPO" >> .env
        [ -n "$PRIVATE_ECR_REPO_REGION" ] && echo "PRIVATE_ECR_REPO_REGION=$PRIVATE_ECR_REPO_REGION" >> .env

        echo "Generated .env file contents:"
        cat .env
        echo "Testing .env file..."
        npm run env:test
      - echo "Building solution..."
      - npm run build
  build:
    commands:
      # Deploy Account Pool Stack (Root Account)
      - |
        echo "=========================================="
        echo "Assuming CDK deployment role for Account Pool Stack"
        echo "=========================================="
        # ORG_MGT_ACCOUNT_ID and AWS_REGION should be set by CodeBuild project
        ORG_MGT_ACCOUNT_DEPLOY_ROLE_ARN="arn:aws:iam::${ORG_MGT_ACCOUNT_ID}:role/innovation-sandbox-pipeline-deployment-role"
        echo "Assuming CDK deployment role: ${ORG_MGT_ACCOUNT_DEPLOY_ROLE_ARN}"
        ORG_MGT_ACCOUNT_CREDS=$(aws sts assume-role \
          --role-arn "${ORG_MGT_ACCOUNT_DEPLOY_ROLE_ARN}" \
          --role-session-name "CodeBuild-Deploy-AccountPool-$(date +%s)")
        export AWS_ACCESS_KEY_ID=$(echo $ORG_MGT_ACCOUNT_CREDS | jq -r '.Credentials.AccessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo $ORG_MGT_ACCOUNT_CREDS | jq -r '.Credentials.SecretAccessKey')
        export AWS_SESSION_TOKEN=$(echo $ORG_MGT_ACCOUNT_CREDS | jq -r '.Credentials.SessionToken')
        export AWS_DEFAULT_REGION="${AWS_REGION}"
        aws sts get-caller-identity
      - |
        echo "=========================================="
        echo "Deploying Account Pool Stack"
        echo "=========================================="
        npm run deploy:account-pool
      # Clear AWS credentials
      - |
        echo "=========================================="
        echo "Clearing AWS credentials"
        echo "=========================================="
        unset AWS_ACCESS_KEY_ID
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN
        unset AWS_DEFAULT_REGION
        aws sts get-caller-identity
      # Deploy IDC Stack (Root Account)
      - |
        echo "=========================================="
        echo "Assuming CDK deployment role for IDC Stack"
        echo "=========================================="
        # IDC_ACCOUNT_ID and AWS_REGION should be set by CodeBuild project
        IDC_DEPLOY_ROLE_ARN="arn:aws:iam::${IDC_ACCOUNT_ID}:role/innovation-sandbox-pipeline-deployment-role"
        echo "Assuming CDK deployment role: ${IDC_DEPLOY_ROLE_ARN}"
        IDC_CREDS=$(aws sts assume-role \
          --role-arn "${IDC_DEPLOY_ROLE_ARN}" \
          --role-session-name "CodeBuild-Deploy-IDC-$(date +%s)")
        export AWS_ACCESS_KEY_ID=$(echo $IDC_CREDS | jq -r '.Credentials.AccessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo $IDC_CREDS | jq -r '.Credentials.SecretAccessKey')
        export AWS_SESSION_TOKEN=$(echo $IDC_CREDS | jq -r '.Credentials.SessionToken')
        export AWS_DEFAULT_REGION="${AWS_REGION}"
        aws sts get-caller-identity
      - |
        echo "=========================================="
        echo "Deploying IDC Stack"
        echo "=========================================="
        npm run deploy:idc
      # Clear AWS credentials
      - |
        echo "=========================================="
        echo "Clearing AWS credentials"
        echo "=========================================="
        unset AWS_ACCESS_KEY_ID
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN
        unset AWS_DEFAULT_REGION
        aws sts get-caller-identity
      # Deploy Data Stack (Main Account)
      - |
        echo "=========================================="
        echo "Assuming CDK deployment role for Data and Compute Stacks"
        echo "=========================================="
        # HUB_ACCOUNT_ID and AWS_REGION should be set by CodeBuild project
        HUB_DEPLOY_ROLE_ARN="arn:aws:iam::${HUB_ACCOUNT_ID}:role/innovation-sandbox-pipeline-deployment-role"
        echo "Assuming CDK deployment role: ${HUB_DEPLOY_ROLE_ARN}"
        HUB_ACCOUNT_CREDS=$(aws sts assume-role \
          --role-arn "${HUB_DEPLOY_ROLE_ARN}" \
          --role-session-name "CodeBuild-Deploy-Data-$(date +%s)")
        export AWS_ACCESS_KEY_ID=$(echo $HUB_ACCOUNT_CREDS | jq -r '.Credentials.AccessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo $HUB_ACCOUNT_CREDS | jq -r '.Credentials.SecretAccessKey')
        export AWS_SESSION_TOKEN=$(echo $HUB_ACCOUNT_CREDS | jq -r '.Credentials.SessionToken')
        export AWS_DEFAULT_REGION="${AWS_REGION}"
        aws sts get-caller-identity
      - |
        echo "=========================================="
        echo "Deploying Data Stack"
        echo "=========================================="
        npm run deploy:data
      # Deploy Compute Stack (Main Account)
      - |
        echo "=========================================="
        echo "Deploying Compute Stack"
        echo "=========================================="
        # HUB_DEPLOY_ROLE_ARN should be set by CodeBuild project
        echo "Continuing use of existing ${HUB_DEPLOY_ROLE_ARN} credentials for Compute Stack deployment..."
        npm run deploy:compute
      - echo "=========================================="
      - echo "Deployment complete!"
      - echo "=========================================="
artifacts:
  files:
    - '**/*'
  name: deployment-artifacts-$(date +%Y-%m-%d)
